name: interlinked-action
description: Flags pull request descriptions that look agent-written
author: Matteo Gabriele
branding:
  icon: eye
  color: purple

inputs:
  github-token:
    description: "Token used to read the repo's PR template, update the PR description and manage the label. Needs `pull-requests: write`."
    required: false
    default: ${{ github.token }}
  allowed-users:
    description: "List of usernames to skip from analysis. Can use array syntax in workflow YAML."
    required: false
    default: ""
  trusted-author-associations:
    description: "List of author associations to skip from analysis (collaborator, contributor, first_timer, first_time_contributor, member, owner). Can use array syntax in workflow YAML. Set to an empty string to analyze everyone."
    required: false
    default: "member,owner"
  mode:
    description: "How interlinked should act on its findings: 'full' (description and labels), 'labels' (labels only), 'description' (description only), or 'silent' (outputs and job summary only)."
    required: false
    default: "labels"
  label-ai:
    description: "Label to add when the description reads as agent-written. Never removed automatically; a maintainer clears it."
    required: false
    default: "agent-written"
  auto-close:
    description: "Whether to automatically close PRs whose description reads as agent-written."
    required: false
    default: "false"
  message-ai:
    description: "Custom message to add to the analysis when the description reads as agent-written."
    required: false
    default: ""
  message-human:
    description: "Custom message to add to the analysis when the description reads as human-written."
    required: false
    default: ""
  fail-on-ai:
    description: "Fail the step when the description reads as agent-written."
    required: false
    default: "false"

outputs:
  verdict:
    description: "`ai` or `human`."
  probability:
    description: Agent-style score, 0 to 1.
  confidence:
    description: Confidence in the verdict, 0.5 to 1.
  signals:
    description: The signals that fired, as JSON.

runs:
  using: node24
  main: dist/index.mjs
