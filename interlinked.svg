<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Cuts the modules where the scanner bar overlaps them, so the gap stays transparent on any background -->
    <mask id="scanner-cutout">
      <rect width="500" height="500" fill="#ffffff" />
      <rect x="203" y="73" width="94" height="354" rx="47" fill="#000000" />
    </mask>
  </defs>
  <g fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#scanner-cutout)">
      <!-- Left Module (Camera / Sensor Block) -->
      <!-- Outer Shell with Rounded Corners -->
      <rect x="70" y="180" width="160" height="140" rx="16" />

      <!-- Diagonal Panel Divider Line -->
      <line x1="70" y1="260" x2="175" y2="180" />

      <!-- Small Top-Left Sensor Circle -->
      <circle cx="115" cy="220" r="14" stroke-width="10" />
      <circle cx="115" cy="220" r="3" fill="#000000" />

      <!-- Small Bottom-Left Sensor Circle -->
      <circle cx="115" cy="280" r="14" stroke-width="10" />
      <circle cx="115" cy="280" r="3" fill="#000000" />

      <!-- Main Center Lens -->
      <circle cx="170" cy="265" r="24" stroke-width="12" />
      <circle cx="170" cy="265" r="8" fill="#000000" />

      <!-- Right Module (Vent Grill Block) -->
      <path d="M 270 180 L 390 180 A 16 16 0 0 1 406 196 L 406 304 A 16 16 0 0 1 390 320 L 270 320" />

      <!-- Horizontal Vent Lines -->
      <line x1="290" y1="215" x2="380" y2="215" stroke-width="10" />
      <line x1="290" y1="240" x2="380" y2="240" stroke-width="10" />
      <line x1="290" y1="265" x2="380" y2="265" stroke-width="10" />
      <line x1="290" y1="290" x2="380" y2="290" stroke-width="10" />
    </g>

    <!-- Center Vertical Scanner Bar (Foreground Overlay) -->
    <!-- Outer Capsule Rim -->
    <rect x="210" y="80" width="80" height="340" rx="40" stroke-width="14" />

    <!-- Inner Vertical Scan Slot -->
    <rect x="241" y="115" width="18" height="270" rx="9" fill="#000000" stroke="none" />
  </g>
</svg>
